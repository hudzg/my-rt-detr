task: detection

num_classes: 8

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/acdc/rgb_anon/
    ann_file: ./dataset/acdc/gt_detection/instancesonly_train_gt_detection_remapped.json
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  batch_size: 8
  num_workers: 4
  drop_last: True

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/acdc/rgb_anon/
    ann_file: ./dataset/acdc/gt_detection/instancesonly_val_gt_detection_remapped.json
    transforms:
      type: Compose
      ops: ~

  shuffle: False
  batch_size: 8
  num_workers: 4
  drop_last: False
