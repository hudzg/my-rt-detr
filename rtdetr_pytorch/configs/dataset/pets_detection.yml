task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ["bbox"]

# Oxford Pets có 37 classes
num_classes: 37 

train_dataloader:
  type: DataLoader
  dataset:
    type: VOCDetection
    # Root folder của dataset
    root: ./dataset/pets/
    # Đường dẫn tương đối từ root đến file split (dựa theo cấu trúc folder bạn gửi)
    ann_file: annotations/trainval.txt
    label_file: label_list.txt
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 2
  batch_size: 8
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion

val_dataloader:
  type: DataLoader
  dataset:
    type: VOCDetection
    root: ./dataset/pets/
    # Đường dẫn tương đối từ root đến file split
    ann_file: annotations/test.txt
    label_file: label_list.txt
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 2
  batch_size: 16
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion