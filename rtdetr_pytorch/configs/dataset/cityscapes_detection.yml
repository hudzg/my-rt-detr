task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ["bbox"]

num_classes: 8

train_dataloader:
  type: DataLoader
  dataset:
    type: CityscapesDetection
    root: ./dataset/cityscapes/
    ann_file: train.txt
    label_file: label_list.txt
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 2
  batch_size: 8
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion

val_dataloader:
  type: DataLoader
  dataset:
    type: CityscapesDetection
    root: ./dataset/cityscapes/
    ann_file: val.txt
    label_file: label_list.txt
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 2
  batch_size: 16
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion
